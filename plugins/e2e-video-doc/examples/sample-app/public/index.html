<!doctype html>
<meta charset="utf-8">
<title>Sample shop</title>
<link rel="stylesheet" href="/styles.css">
<header>
  <h1 data-i18n="brand">Sample shop</h1>
  <span class="cart-count" id="cart-count"></span>
</header>
<main>
  <div class="layout">
    <section>
      <h2 data-i18n="catalogue">Catalogue</h2>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th data-i18n="product">Product</th>
              <th>SKU</th>
              <th class="price" data-i18n="price">Price</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="catalog"></tbody>
        </table>
      </div>
    </section>

    <aside>
      <h2 data-i18n="your_order">Your order</h2>
      <div class="card" id="cart-card">
        <div class="cart-body">
          <div id="cart-lines"></div>
          <div id="cart-total"><span data-i18n="total">Total</span><span id="total-amount"></span></div>
          <label for="customer" data-i18n="name">Name</label>
          <input id="customer">
          <p style="margin:16px 0 0"><button id="place-order" data-i18n="place_order" disabled>Place order</button></p>
        </div>
      </div>

      <div class="card hidden" id="confirmation" style="margin-top:18px">
        <div class="confirmation">
          <div class="tick">✓</div>
          <p style="margin:0;color:#66707b;font-size:14px" data-i18n="confirmed">Order confirmed</p>
          <p class="order-id" id="order-id"></p>
          <p style="margin:4px 0 0"><span class="badge" id="order-status"></span></p>
        </div>
      </div>
    </aside>
  </div>
</main>
<script src="/app.js"></script>
